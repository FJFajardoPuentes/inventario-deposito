<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login - Inventario Interno Depósito</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

  <section class="login-card">
    <h1>Inventario Interno Depósito</h1>
    <h2>Iniciar sesión</h2>

    <p id="mensajeLogin"></p>

    <form id="formLogin">
      <label>Usuario</label>
      <input id="emailLogin" type="text" placeholder="Ej: usuario">

      <label>Contraseña</label>
      <input id="passwordLogin" type="password" placeholder="Contraseña">

      <button class="accion" type="submit">Ingresar</button>
    </form>
  </section>

  <script src="login.js"></script>
</body>
</html>
